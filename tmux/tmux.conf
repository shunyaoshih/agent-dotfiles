# tmux config. See AGENTS.md for the conventions this file follows.

# Prefix C-a; press it twice to send C-a through (e.g. to tmux nested over SSH).
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g history-limit 50000
set -g mouse on
set -g mode-keys vi
set -g base-index 1
set -g renumber-windows on
set -g set-titles on
# Needed by Neovim's autoread.
set -g focus-events on
# When a session is killed, switch to another one instead of detaching.
set -g detach-on-destroy off

# Let programs (Neovim, agents, nested tmux) copy to the system clipboard via
# OSC 52. Every terminal we attach from (Ghostty, or tmux when nested over SSH)
# supports truecolor, OSC 52, and OSC 8 hyperlinks (e.g. links an agent prints).
set -s set-clipboard on
# A fixed index (past tmux's defaults) so reloading doesn't append duplicates.
set -s terminal-features[10] "*:RGB:clipboard:hyperlinks"
# Neovim inside tmux only enables truecolor when COLORTERM is set, and SSH
# doesn't forward it.
set-environment -g COLORTERM truecolor

# Default keys, but open new windows and panes in the current directory.
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# Sessions: s switches, N creates, X kills and $ renames. With fzf, s, X and $
# pick sessions in session-picker.sh's order ("main", then "controller", "worker"
# last); X can mark several with Tab. Without fzf, they list sessions by name.
# run-shell -C fills in #{client_name}, which display-popup leaves as is. The
# popup colors are the Tokyo Night fzf theme's background and border.
# An empty name would make a session named "", so it does nothing.
bind N command-prompt -p "New session:" { if -F '#{!=:%%,}' { new-session -s "%%" } }
if 'command -v fzf' {
	bind s run-shell -C "display-popup -E -w 80% -h 80% -s bg=#16161e -S fg=#27a1b9,bg=#16161e \"~/.config/tmux/session-picker.sh switch '#{client_name}'\""
	bind X run-shell -C "display-popup -E -w 80% -h 80% -s bg=#16161e -S fg=#27a1b9,bg=#16161e \"~/.config/tmux/session-picker.sh kill '#{client_name}'\""
	bind '$' run-shell -C "display-popup -E -w 80% -h 80% -s bg=#16161e -S fg=#27a1b9,bg=#16161e \"~/.config/tmux/session-picker.sh rename '#{client_name}'\""
	# Agent dashboard: see agents-dashboard.sh.
	bind a run-shell "~/.config/tmux/agents-dashboard.sh open '#{client_name}' '#{pane_id}' '#{session_id}'"
	set-hook -g window-unlinked 'run-shell "~/.config/tmux/agents-dashboard.sh keep"'
	# For its done state, record when each pane was last looked at. T: expands
	# strftime's %s, the current time. Panes not looked at since tmux first loaded
	# this file count from then.
	set -g @agents_now '%s'
	set-hook -g pane-focus-in { set -pF @agents_seen '#{T:@agents_now}' }
	set-hook -g pane-focus-out { set -pF @agents_seen '#{T:@agents_now}' }
	if -F '#{==:#{@agents_seen},}' { set -gwF @agents_seen '#{T:@agents_now}' }
} {
	bind s choose-tree -Zs -O name
	bind X choose-tree -Zs -O name { kill-session -t "%%" }
	# choose-tree fills in only the first %%, so the second is left for the prompt.
	bind '$' choose-tree -Zs -O name { run-shell -C -t "%%" "command-prompt -I '#{session_name}' -p 'Rename session:' { rename-session -t '=#{session_name}' -- '%%' }" }
}

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Default keys, but close windows and panes without confirmation.
bind & kill-window
bind x kill-pane

# e for "erase".
bind e clear-history

# Vim-style selection in copy mode, plus hop.nvim-style 2-character jump.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi s run-shell -C "display-popup -c '#{client_name}' -t '#{pane_id}' -B -E -x P -y P -w #{pane_width} -h #{pane_height} /usr/bin/perl $HOME/.config/tmux/hop.pl #{pane_id} #{pane_width} #{pane_height} #{scroll_position} #{copy_cursor_x} #{copy_cursor_y}"
# [ and ] jump between Claude Code prompts, with the prompt at the top of the
# screen. They don't stop at ⏺ lines, which also mark every tool call.
bind -T copy-mode-vi [ { send -X search-backward '^❯ '; send -X scroll-top }
bind -T copy-mode-vi ] { send -X search-forward '^❯ '; send -X scroll-top }
# Copy a mouse selection without leaving copy mode, so reading keeps its place.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# Verbatim copy of tokyonight.nvim's extras/tmux/tokyonight_night.tmux.
source-file ~/.config/tmux/tokyonight_night.tmux
# tmux 3.8 draws messages and prompts on top of the status line, which shows
# through unless the style fills the background, as the default style does.
set -g message-style "fg=#7aa2f7,bg=#3b4261,fill=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261,fill=#3b4261"
# The agent dashboard's blocked and done counts, left of the theme's clock and
# refreshed as often as the dashboard. ## keeps -F from running the command now.
if 'command -v fzf' {
	set -gF status-right '##(~/.config/tmux/agents-dashboard.sh status)#{status-right}'
	set -g status-interval 2
}

# Machine-specific config (untracked). See local.example.conf.
source-file -q ~/.config/tmux/local.conf
