# AeroSpace config (MacBook only). See AGENTS.md. This file replaces AeroSpace's
# default keys, which use alt+letter and would take over fish's Alt bindings in
# Ghostty.

config-version = 2
start-at-login = true

[mode.main.binding]
# One workspace per main app, plus one for messaging: c Claude, g Google Chrome,
# m messaging, t terminal. ctrl+alt+letter jumps to it and opens the app if it
# isn't running. -g keeps M on whichever messaging app was last in use.
ctrl-alt-c = ['workspace C', 'exec-and-forget open -a Claude']
ctrl-alt-g = ['workspace G', 'exec-and-forget open -a "Google Chrome"']
ctrl-alt-m = ['workspace M', 'exec-and-forget open -g -a LINE; open -g -a Telegram']
ctrl-alt-t = ['workspace T', 'exec-and-forget open -a Ghostty']

# Add shift to send the current window to that workspace, where it splits the
# screen with what's already there.
ctrl-alt-shift-c = 'move-node-to-workspace C --focus-follows-window'
ctrl-alt-shift-g = 'move-node-to-workspace G --focus-follows-window'
ctrl-alt-shift-m = 'move-node-to-workspace M --focus-follows-window'
ctrl-alt-shift-t = 'move-node-to-workspace T --focus-follows-window'

# Switch between windows on a workspace, wrapping around so either arrow always
# moves to the other of two windows. Add shift to swap their sides.
ctrl-alt-left = 'focus --wrap-around left'
ctrl-alt-right = 'focus --wrap-around right'
ctrl-alt-shift-left = 'move left'
ctrl-alt-shift-right = 'move right'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace G'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'jp.naver.line.mac'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = 'move-node-to-workspace M'

# Other apps float, as they would without AeroSpace, instead of squeezing into a
# main app's workspace.
[[on-window-detected]]
if = 'true'
run = 'layout floating'
